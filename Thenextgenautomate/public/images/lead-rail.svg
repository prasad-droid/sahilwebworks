<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="railTitle railDesc">
  <title id="railTitle">Lead-to-booking automation map</title>
  <desc id="railDesc">A six-stage rail from enquiry capture to review, with guardrails and human approval.</desc>
  <defs>
    <pattern id="railDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e5d7c7" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="#fffdf9" />
  <rect width="1200" height="520" fill="url(#railDots)" />

  <text x="48" y="62" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#8d7d6e">RUNBOOK 004 / LEAD-TO-BOOKING</text>
  <text x="1152" y="62" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.4" fill="#2c5a43">BUILT IN 6 DAYS</text>

  <text x="48" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1d1611">One enquiry, six moves, zero copy-paste.</text>
  <text x="48" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#6b5c4f">The rail we adapt most often. Every box has an owner and a fallback.</text>
  <line x1="48" y1="164" x2="1152" y2="164" stroke="#e5d7c7" stroke-width="1" />

  <!-- 01 Capture -->
  <g>
    <rect x="48" y="196" width="160" height="96" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="62" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8d7d6e">01 / CAPTURE</text>
    <text x="62" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Capture</text>
    <text x="62" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Ad form, WhatsApp,</text>
    <text x="62" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">missed call.</text>
  </g>

  <!-- 02 Qualify -->
  <g>
    <rect x="236" y="196" width="160" height="96" rx="4" fill="#fff7ef" stroke="#c9450b" />
    <circle cx="380" cy="206" r="3" fill="#c9450b" />
    <text x="250" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8a2f05">02 / QUALIFY</text>
    <text x="250" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Qualify</text>
    <text x="250" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">AI asks 2–3 questions</text>
    <text x="250" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">and scores H / W / C.</text>
  </g>

  <!-- 03 Branch -->
  <g>
    <rect x="424" y="196" width="160" height="96" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="438" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8d7d6e">03 / BRANCH</text>
    <text x="438" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Branch</text>
    <text x="438" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Hot books now.</text>
    <text x="438" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Warm gets 5-day nurture.</text>
  </g>

  <!-- 04 Book -->
  <g>
    <rect x="612" y="196" width="160" height="96" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="626" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8d7d6e">04 / BOOK</text>
    <text x="626" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Book</text>
    <text x="626" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Cal.com slot.</text>
    <text x="626" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Confirmation sent.</text>
  </g>

  <!-- 05 Remind -->
  <g>
    <rect x="800" y="196" width="160" height="96" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="814" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8d7d6e">05 / REMIND</text>
    <text x="814" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Remind</text>
    <text x="814" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">24h + 2h reminders.</text>
    <text x="814" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">No-show flag.</text>
  </g>

  <!-- 06 Review -->
  <g>
    <rect x="988" y="196" width="160" height="96" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="1002" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8d7d6e">06 / REVIEW</text>
    <text x="1002" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d1611">Review</text>
    <text x="1002" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">2h after service.</text>
    <text x="1002" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b5c4f">Public or private path.</text>
  </g>

  <!-- connectors -->
  <g stroke="#c9450b" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M208 244H230" /><path d="M226 240l4 4-4 4" />
    <path d="M396 244H418" /><path d="M414 240l4 4-4 4" />
    <path d="M584 244H606" /><path d="M602 240l4 4-4 4" />
    <path d="M772 244H794" /><path d="M790 240l4 4-4 4" />
    <path d="M960 244H982" /><path d="M978 240l4 4-4 4" />
  </g>

  <line x1="48" y1="336" x2="1152" y2="336" stroke="#cdb9a3" stroke-width="1" stroke-dasharray="3 5" />

  <text x="48" y="366" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.6" fill="#8d7d6e">GUARDRAILS</text>

  <g>
    <rect x="48" y="382" width="252" height="38" rx="3" fill="#f4ece1" stroke="#e5d7c7" />
    <rect x="62" y="397" width="6" height="6" fill="#c9450b" />
    <text x="78" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#33281f">Human approval on pricing</text>
  </g>
  <g>
    <rect x="316" y="382" width="222" height="38" rx="3" fill="#f4ece1" stroke="#e5d7c7" />
    <rect x="330" y="397" width="6" height="6" fill="#c9450b" />
    <text x="346" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#33281f">Retry on every API call</text>
  </g>
  <g>
    <rect x="554" y="382" width="264" height="38" rx="3" fill="#f4ece1" stroke="#e5d7c7" />
    <rect x="568" y="397" width="6" height="6" fill="#c9450b" />
    <text x="584" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#33281f">Dead-letter queue for failures</text>
  </g>

  <text x="1152" y="406" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#8d7d6e">n8n · Claude · WhatsApp API · Cal.com</text>

  <text x="48" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#8a2f05">“If a lead can disappear quietly, the build is not finished.”</text>
  <text x="1152" y="474" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9.5" letter-spacing="1.2" fill="#2c5a43">TARGET FIRST REPLY &lt; 60S</text>
</svg>
