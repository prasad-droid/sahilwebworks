<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700" role="img" aria-labelledby="ruleMobileTitle ruleMobileDesc">
  <title id="ruleMobileTitle">Rule, AI or human decision map</title>
  <desc id="ruleMobileDesc">A vertical decision map showing when to use a rule, AI with guardrails, or a human in the loop.</desc>
  <defs>
    <pattern id="ruleMobileDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e5d7c7" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="360" height="700" fill="#fffdf9" />
  <rect width="360" height="700" fill="url(#ruleMobileDots)" />

  <text x="20" y="30" font-family="Consolas, 'Courier New', monospace" font-size="8.5" letter-spacing="1.2" fill="#8d7d6e">BEFORE WE BUILD / DECISION 01</text>
  <text x="20" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1d1611">Use the cheapest</text>
  <text x="20" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1d1611">tool that works.</text>
  <text x="20" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">A rule is cheaper than a model.</text>
  <text x="20" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">A human is better when judgement matters.</text>
  <line x1="20" y1="132" x2="340" y2="132" stroke="#e5d7c7" stroke-width="1" />

  <rect x="20" y="146" width="320" height="42" rx="4" fill="#fff7ef" stroke="#c9450b" />
  <text x="180" y="162" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="8" letter-spacing="1" fill="#8a2f05">THE PROCESS</text>
  <text x="180" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d1611">A task in front of us</text>

  <line x1="20" y1="188" x2="20" y2="580" stroke="#cdb9a3" stroke-width="1" />

  <!-- 01 -->
  <circle cx="20" cy="266" r="4" fill="#fffdf9" stroke="#cdb9a3" />
  <line x1="24" y1="266" x2="36" y2="266" stroke="#cdb9a3" stroke-width="1" />
  <rect x="36" y="208" width="304" height="116" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
  <text x="50" y="228" font-family="Consolas, 'Courier New', monospace" font-size="8" letter-spacing="0.9" fill="#8d7d6e">01 / STRUCTURED INPUT</text>
  <text x="50" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d1611">Write a rule</text>
  <text x="50" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Forms, routing, reminders, math.</text>
  <text x="50" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Test it, log it, and move on.</text>
  <line x1="50" y1="300" x2="326" y2="300" stroke="#e5d7c7" stroke-width="1" />
  <text x="50" y="316" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="0.7" fill="#2c5a43">CHEAPEST · EASIEST TO TEST</text>

  <!-- 02 -->
  <circle cx="20" cy="394" r="4" fill="#fff7ef" stroke="#c9450b" />
  <line x1="24" y1="394" x2="36" y2="394" stroke="#c9450b" stroke-width="1" />
  <rect x="36" y="336" width="304" height="116" rx="4" fill="#fff7ef" stroke="#c9450b" />
  <text x="50" y="356" font-family="Consolas, 'Courier New', monospace" font-size="8" letter-spacing="0.9" fill="#8a2f05">02 / UNSTRUCTURED INPUT</text>
  <text x="50" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d1611">AI + guardrails</text>
  <text x="50" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Messages, calls and documents.</text>
  <text x="50" y="412" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Confidence gate + human fallback.</text>
  <line x1="50" y1="428" x2="326" y2="428" stroke="#e5d7c7" stroke-width="1" />
  <text x="50" y="444" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="0.7" fill="#8a2f05">ONLY WHERE LANGUAGE LIVES</text>

  <!-- 03 -->
  <circle cx="20" cy="522" r="4" fill="#fffdf9" stroke="#cdb9a3" />
  <line x1="24" y1="522" x2="36" y2="522" stroke="#cdb9a3" stroke-width="1" />
  <rect x="36" y="464" width="304" height="116" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
  <text x="50" y="484" font-family="Consolas, 'Courier New', monospace" font-size="8" letter-spacing="0.9" fill="#8d7d6e">03 / JUDGEMENT OR MONEY</text>
  <text x="50" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d1611">Keep a human</text>
  <text x="50" y="526" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Pricing, refunds, sensitive calls.</text>
  <text x="50" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b5c4f">Automation prepares, a person decides.</text>
  <line x1="50" y1="556" x2="326" y2="556" stroke="#e5d7c7" stroke-width="1" />
  <text x="50" y="572" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="0.7" fill="#8d7d6e">ASSISTS, DOES NOT DECIDE</text>

  <line x1="20" y1="600" x2="340" y2="600" stroke="#e5d7c7" stroke-width="1" />

  <text x="20" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#8a2f05">“We do not sell AI where</text>
  <text x="20" y="644" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#8a2f05">a form rule will do.”</text>
  <text x="340" y="678" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="7.5" letter-spacing="0.9" fill="#2c5a43">MOST BUILDS USE ALL THREE</text>
</svg>
