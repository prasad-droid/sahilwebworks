<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="ruleTitle ruleDesc">
  <title id="ruleTitle">Rule, AI or human decision map</title>
  <desc id="ruleDesc">A decision map showing when to use a rule, AI with guardrails, or a human in the loop.</desc>
  <defs>
    <pattern id="ruleDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e5d7c7" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="900" height="520" fill="#fffdf9" />
  <rect width="900" height="520" fill="url(#ruleDots)" />

  <text x="40" y="52" font-family="Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.8" fill="#8d7d6e">BEFORE WE BUILD / DECISION 01</text>
  <text x="40" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1d1611">Use the cheapest tool that works.</text>
  <text x="40" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b5c4f">A rule is cheaper than a model. A human is better than both when judgement matters.</text>
  <line x1="40" y1="146" x2="860" y2="146" stroke="#e5d7c7" stroke-width="1" />

  <rect x="330" y="170" width="240" height="52" rx="4" fill="#fff7ef" stroke="#c9450b" />
  <text x="450" y="192" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#8a2f05">THE PROCESS</text>
  <text x="450" y="211" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d1611">A task in front of us</text>

  <g stroke="#cdb9a3" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 222v28" />
    <path d="M160 250h580" />
    <path d="M160 250v20M450 250v20M740 250v20" />
    <path d="M156 266l4 4 4-4M446 266l4 4 4-4M736 266l4 4 4-4" />
  </g>

  <!-- Column 1 -->
  <g>
    <rect x="40" y="274" width="240" height="180" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="56" y="298" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.1" fill="#8d7d6e">01 / STRUCTURED INPUT</text>
    <text x="56" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1d1611">Write a rule</text>
    <text x="56" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">Forms, routing, reminders,</text>
    <text x="56" y="369" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">math. Test it, log it,</text>
    <text x="56" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">and move on.</text>
    <line x1="56" y1="414" x2="264" y2="414" stroke="#e5d7c7" stroke-width="1" />
    <text x="56" y="434" font-family="Consolas, 'Courier New', monospace" font-size="8.5" letter-spacing="0.9" fill="#2c5a43">CHEAPEST · EASIEST TO TEST</text>
  </g>

  <!-- Column 2 -->
  <g>
    <rect x="330" y="274" width="240" height="180" rx="4" fill="#fff7ef" stroke="#c9450b" />
    <text x="346" y="298" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.1" fill="#8a2f05">02 / UNSTRUCTURED INPUT</text>
    <text x="346" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1d1611">AI + guardrails</text>
    <text x="346" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">Messages, calls and docs.</text>
    <text x="346" y="369" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">Confidence gate, retries,</text>
    <text x="346" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">and a human fallback.</text>
    <line x1="346" y1="414" x2="554" y2="414" stroke="#e5d7c7" stroke-width="1" />
    <text x="346" y="434" font-family="Consolas, 'Courier New', monospace" font-size="8.5" letter-spacing="0.9" fill="#8a2f05">ONLY WHERE LANGUAGE LIVES</text>
  </g>

  <!-- Column 3 -->
  <g>
    <rect x="620" y="274" width="240" height="180" rx="4" fill="#fffdf9" stroke="#cdb9a3" />
    <text x="636" y="298" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.1" fill="#8d7d6e">03 / JUDGEMENT OR MONEY</text>
    <text x="636" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1d1611">Keep a human</text>
    <text x="636" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">Pricing, refunds and</text>
    <text x="636" y="369" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">sensitive conversations.</text>
    <text x="636" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b5c4f">Automation prepares the call.</text>
    <line x1="636" y1="414" x2="844" y2="414" stroke="#e5d7c7" stroke-width="1" />
    <text x="636" y="434" font-family="Consolas, 'Courier New', monospace" font-size="8.5" letter-spacing="0.9" fill="#8d7d6e">ASSISTS, DOES NOT DECIDE</text>
  </g>

  <text x="40" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#8a2f05">“We do not sell AI where a form rule will do.”</text>
  <text x="860" y="498" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="1.2" fill="#2c5a43">MOST BUILDS USE ALL THREE</text>
</svg>
