    <rect x="0" y="210" width="440" height="90" rx="14" fill="#e6f1fa"/>
    <rect x="0" y="210" width="440" height="90" rx="14" fill="url(#terry)"/>
    <rect x="0" y="300" width="440" height="90" rx="14" fill="url(#tow)"/>
    <rect x="0" y="300" width="440" height="90" rx="14" fill="url(#terry)"/>
    <rect x="0" y="112" width="440" height="16" rx="8" fill="url(#band)"/>
    <rect x="0" y="202" width="440" height="16" rx="8" fill="url(#band)"/>
    <rect x="0" y="292" width="440" height="16" rx="8" fill="url(#gold)"/>
