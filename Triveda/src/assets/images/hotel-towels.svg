<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7fb"/>
      <stop offset="1" stop-color="#dce9f4"/>
    </linearGradient>
    <linearGradient id="tow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9e1f5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B5C84"/>
      <stop offset="0.5" stop-color="#5FA8D3"/>
      <stop offset="1" stop-color="#2B5C84"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#a8861d"/>
    </linearGradient>
    <pattern id="terry" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="2.2" fill="rgba(43,92,132,0.07)"/>
