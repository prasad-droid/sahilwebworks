  </defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <circle cx="480" cy="440" r="170" fill="rgba(95,168,211,0.20)"/>
  <circle cx="110" cy="90" r="140" fill="rgba(201,162,39,0.12)"/>
  <g transform="translate(80,30)">
