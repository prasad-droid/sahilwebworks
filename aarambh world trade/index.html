<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Scroll-reveal content starts at opacity 0 and is shown by adding
      .is-visible from JS. If the script never runs, that would leave whole
      sections permanently invisible, so the no-js class is removed as soon as
      scripting is available and the stylesheet reveals everything under .no-js.
    -->
    <script>
      document.documentElement.classList.remove('no-js');
    </script>

    <!--
      Build-time metadata. Mirrors src/data/seo.js, which keeps it accurate at
      runtime. Update BOTH together, or move these values into src/data/seo.js
      only and generate the tags at build time.
    -->
    <title>Aarambh Worldtrade | Indian Agricultural &amp; Food Products Exporter</title>
    <meta
      name="description"
      content="AARAMBH WORLDTRADE is an Indian merchant exporter supplying agricultural and food products including onion powder, moringa powder, tomato powder, ginger powder, spices, rice and raisins for global B2B buyers."
    />
    <meta
      name="keywords"
      content="indian agricultural products exporter, dehydrated onion powder supplier, moringa powder exporter, tomato powder bulk supplier, ginger powder export, beetroot powder bulk, banana powder supplier, indian spices exporter, basmati rice export, indian raisins supplier, merchant exporter India, bulk spice supplier B2B, food ingredients exporter India, agricultural products wholesale India, spice trader India"
    />
    <meta name="author" content="AARAMBH WORLDTRADE" />
    <meta name="theme-color" content="#1f4d35" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.aarambhworldtrade.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="AARAMBH WORLDTRADE" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Aarambh Worldtrade | Indian Agricultural &amp; Food Products Exporter" />
    <meta
      property="og:description"
      content="Indian merchant exporter supplying agricultural and food products for global B2B buyers."
    />
    <meta property="og:url" content="https://www.aarambhworldtrade.com/" />
    <meta property="og:image" content="https://www.aarambhworldtrade.com/images/stock/hero-spices.jpg" />
    <meta
      property="og:image:alt"
      content="Indian spices representing the AARAMBH WORLDTRADE product range"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aarambh Worldtrade | Indian Agricultural &amp; Food Products Exporter" />
    <meta
      name="twitter:description"
      content="Indian merchant exporter supplying agricultural and food products for global B2B buyers."
    />
    <meta name="twitter:image" content="https://www.aarambhworldtrade.com/images/stock/hero-spices.jpg" />

<!--
  Favicon: the supplied logo, served from /public. This deliberately uses the
  original opaque logo.png rather than logo-transparent.png: browser tab bars
  are usually light, and a transparent icon disappears on a light background.
-->
<link rel="icon" type="image/png" href="/images/business/logo.png" />
<link rel="apple-touch-icon" href="/images/business/logo.png" />


    <!--
      Self-hosted fonts are declared in src/fonts/fonts.css and bundled by
      Vite, so there is no stable public path to preload here. They load with
      font-display: swap, so text renders immediately in the fallback stack.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>AARAMBH WORLDTRADE</h1>
        <p>
          This site needs JavaScript enabled. To reach us directly, call or WhatsApp
          <a href="tel:+919421606630">+91 9421606630</a> or email
          <a href="mailto:aarambhworldtrade@gmail.com">aarambhworldtrade@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
